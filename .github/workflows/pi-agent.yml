name: Pi AI Agent

on:
  workflow_call:

jobs:
  pi-agent:
    if: >-
      (
          github.event_name == 'issue_comment' &&
          startsWith(github.event.comment.body, '/pi ') &&
          (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
          )
      ) ||
      (
          github.event_name == 'pull_request_review' &&
          startsWith(github.event.review.body, '/pi ') &&
          (
          github.event.review.author_association == 'OWNER' ||
          github.event.review.author_association == 'MEMBER' ||
          github.event.review.author_association == 'COLLABORATOR'
          )
      )

    runs-on: ubuntu-latest

    concurrency:
      group: pi-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        if: ${{ hashFiles('bun.lock') != '' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: ${{ hashFiles('bun.lock') != '' }}
        run: bun install --frozen-lockfile

      - name: Run Pi agent
        id: pi
        uses: shaftoe/pi-coding-agent-action@develop
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          provider: amazon-bedrock
          model: ${{ vars.AGENT_MODEL }}
          thinking_level: ${{ vars.AGENT_THINKING }}
          export_session_html: true
          extensions: |
            npm:pi-web-access
          diff_ignore_patterns: "dist/ bun.lock node_modules/"

      - name: Upload Pi session HTML
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.pi.outputs.session_html_path }}
        with:
          name: pi-session-html-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
          path: ${{ steps.pi.outputs.session_html_path }}
